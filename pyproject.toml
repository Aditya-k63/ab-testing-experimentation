[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experimentlens"
version = "0.1.0"
description = "E-commerce A/B testing and experimentation analytics: hypothesis testing, Bayesian inference, and decision analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Aditya" }]
keywords = [
    "ab-testing",
    "experimentation",
    "hypothesis-testing",
    "bayesian-inference",
    "causal-inference",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "statsmodels>=0.14,<1.0",
]

[project.optional-dependencies]
bayes = [
    "pymc>=5.10,<6.0",
    "arviz>=0.17,<1.0",
]
app = [
    "streamlit>=1.30,<2.0",
    "plotly>=5.18,<7.0",
]
viz = [
    "matplotlib>=3.8,<4.0",
]
notebooks = [
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<7.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.11",
]

[project.urls]
Repository = "https://github.com/Aditya-k63/ab-testing-experimentation"
Issues = "https://github.com/Aditya-k63/ab-testing-experimentation/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/experimentlens"]

[tool.hatch.build.targets.sdist]
include = ["src/experimentlens", "tests", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]
extend-exclude = [".venv", "data", "notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "ANN401",  # allow Any in a few validated boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ANN401"]
"notebooks/*" = ["T20", "ARG", "ANN", "E402"]
"app/*" = ["ARG001", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["experimentlens"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "app"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "pymc.*",
    "arviz.*",
    "pytensor.*",
    "statsmodels.*",
    "streamlit.*",
    "plotly.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=experimentlens",
    "--cov-report=term-missing",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["experimentlens"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]