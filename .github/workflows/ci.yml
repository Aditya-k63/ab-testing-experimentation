name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bayes,app,viz]"

      - name: Ruff
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest -q --no-cov

      - name: Package builds
        run: python -m build --wheel

  dashboard:
    name: Dashboard imports cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bayes,app,viz]"

      - name: Import the app module
        run: |
          python scripts/import_dashboard.py

      - name: Headless smoke test
        run: |
          streamlit run app/streamlit_app.py \
            --server.headless true \
            --server.port 8501 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501 > /dev/null; then
              echo "dashboard responded on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "dashboard did not start in time"
          exit 1